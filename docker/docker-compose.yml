name: terrainx

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-terrainx} -d ${POSTGRES_DB:-terrainx}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - terrainx

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - terrainx

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      RUN_MIGRATIONS: "true"
      # Hugging Face model cache — under the already-persistent storage bind
      # mount, so downloaded depth-model weights survive container restarts.
      HF_HOME: /app/storage/model_cache
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ../backend:/app
      - ../ai:/app/ai
      - ../geospatial:/app/geospatial
      - ../storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - terrainx

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      RUN_MIGRATIONS: "false"
      HF_HOME: /app/storage/model_cache
    command: ["python", "worker.py"]
    volumes:
      - ../backend:/app
      - ../ai:/app/ai
      - ../geospatial:/app/geospatial
      - ../storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, redis; redis.from_url(os.environ['REDIS_URL']).ping()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - terrainx

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - terrainx

volumes:
  pg_data:
  frontend_node_modules:

networks:
  terrainx:
    driver: bridge
